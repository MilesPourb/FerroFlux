[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ferroflux"
version = "0.1.0"
description = "FerroFlux-FM: Mechanistic Neural-Biophysical Foundation Model for Regulated Necrosis & Ferroptosis"
readme = "research_notes/10_complete_data_audit.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "FerroFlux-FM Research Team"}
]
dependencies = [
  "torch>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "duckdb>=1.0.0",
  "scikit-learn>=1.4.0",
  "lightgbm>=4.3.0",
  "xgboost>=2.0.0",
  "rdkit>=2023.9.5",
  "anndata>=0.10.5",
  "h5py>=3.10.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "pyyaml>=6.0.1",
  "pytest>=8.0.0",
  "requests>=2.31.0",
  "tqdm>=4.66.0",
  "alphagenome==2.0.0",
]

[project.scripts]
ferroflux = "ferroflux.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ferroflux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
